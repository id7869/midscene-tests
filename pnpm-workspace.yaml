# pnpm 11 reads dependency-build approvals from this file.
# esbuild and sharp (transitive deps of @midscene/web) need postinstall
# scripts; without approval, strict-dep-builds fails the install with
# ERR_PNPM_IGNORED_BUILDS. Generated by `pnpm approve-builds esbuild sharp`.
allowBuilds:
  esbuild: true
  sharp: true
